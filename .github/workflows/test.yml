name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2.4.0
      - uses: actions/cache@v2.1.7
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2.5.1
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: yarn install
      - name: Compile contracts
        run: yarn run compile
      - name: Store contract artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cotracts-artifacts
          path: artifacts
      - name: Run Tests
        run: |
          SILENT=true make start-ganache
          npx hardhat node
          yarn run test
      - name: Forked Mainnet Tests
        run: |
          fuser -k 8545/tcp
          yarn run node-fork FORKED_TESTS_PROVIDER=${{ secrets.FORKED_TESTS_PROVIDER }}
          yarn run test-fork

  coverage:
    needs: test
    name: Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2.4.0
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2.5.1
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download contracts artifacts
        uses: actions/download-artifact@v3
        with:
          name: contracts-artifacts
          path: artifacts
      - name: Yarn install
        run: yarn install --frozen-lockfile
